<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/logo_td_notext.png">
  <title>TD Games Platform</title>

  <!-- PWA: cài lên màn hình chính, chạy toàn màn hình -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0F0F0F">
  <!-- iOS chưa đọc manifest, phải khai báo riêng -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TD Games">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#FF9500',
              dark: '#FF7A00',
              deep: '#E86800',
            },
            bg: '#0F0F0F',
            surface: '#1A1A1A',
            neutral: {
              light: '#F2F2F2',
              medium: '#9D9C9D',
              dark: '#404040',
            },
            status: {
              success: '#4CAF50',
              error: '#F44336',
              warning: '#FFA726',
              info: '#2196F3',
            }
          },
          fontFamily: {
            montserrat: ['Montserrat', 'sans-serif'],
          },
          backgroundImage: {
            'gradient-primary': 'linear-gradient(135deg, #FF9500 0%, #FF6B00 100%)',
            'gradient-hero': 'linear-gradient(180deg, #1A1A1A 0%, #0F0F0F 100%)',
          },
          boxShadow: {
            /* Buttons */
            'btn-glow': '0 8px 24px rgba(255, 149, 0, 0.4)',
            'btn-glow-hover': '0 12px 32px rgba(255, 149, 0, 0.6)',
            /* Cards */
            'card-glow': '0 8px 32px rgba(0, 0, 0, 0.4)',
            'card-glow-hover': '0 16px 48px rgba(255, 149, 0, 0.3)',
            /* Elevation scale */
            'elevation-sm': '0 2px 8px rgba(0,0,0,0.2)',
            'elevation-md': '0 4px 24px rgba(0,0,0,0.3)',
            'elevation-lg': '0 8px 32px rgba(0,0,0,0.4)',
            'elevation-xl': '0 12px 40px rgba(0,0,0,0.5)',
            /* Orange glow scale */
            'glow-sm': '0 4px 16px rgba(255,149,0,0.3)',
            'glow-md': '0 8px 24px rgba(255,149,0,0.4)',
            'glow-lg': '0 12px 32px rgba(255,149,0,0.6)',
          }
        }
      }
    }
  </script>
  <style>
    /* ── Design Tokens ─────────────────────────────────────────────── */
    :root {
      /* Colors */
      --color-primary:      #FF9500;
      --color-primary-dark: #FF7A00;
      --color-primary-deep: #E86800;
      --color-bg:           #0F0F0F;
      --color-surface:      #1A1A1A;
      --color-gray-light:   #F2F2F2;
      --color-gray-medium:  #9D9C9D;
      --color-gray-dark:    #404040;
      --color-success:      #4CAF50;
      --color-error:        #F44336;
      --color-warning:      #FFA726;
      --color-info:         #2196F3;

      /* Borders */
      --border-subtle: 1px solid rgba(242,242,242,0.1);
      --border-light:  1px solid rgba(255,149,0,0.2);
      --border-medium: 1px solid rgba(255,149,0,0.4);
      --border-strong: 2px solid #FF9500;

      /* Border radius */
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-xl: 24px;

      /* Transitions */
      --transition-fast:   0.2s ease;
      --transition-normal: 0.3s ease;
      --transition-slow:   0.4s ease;

      /* Shadows - elevation */
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 24px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
      --shadow-xl: 0 12px 40px rgba(0,0,0,0.5);

      /* Shadows - glow */
      --glow-sm: 0 4px 16px rgba(255,149,0,0.3);
      --glow-md: 0 8px 24px rgba(255,149,0,0.4);
      --glow-lg: 0 12px 32px rgba(255,149,0,0.6);

      /* Spacing */
      --gap-sm: 16px;
      --gap-md: 24px;
      --gap-lg: 40px;

      /* Grid */
      --container-max: 1400px;
      --container-form: 800px;
    }

    /* ── Base ──────────────────────────────────────────────────────── */
    body {
      background-color: #0F0F0F;
      color: #F2F2F2;
      font-family: 'Montserrat', sans-serif;
    }

    /* ── Focus accessibility ───────────────────────────────────────── */
    :focus-visible {
      outline: 3px solid #FF9500;
      outline-offset: 2px;
    }

    /* ── Screen reader only ────────────────────────────────────────── */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* ── Keyframes ─────────────────────────────────────────────────── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px) }
      to   { opacity: 1; transform: translateY(0) }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9) }
      to   { opacity: 1; transform: scale(1) }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) }
      25%       { transform: translateX(-10px) }
      75%       { transform: translateX(10px) }
    }

    @keyframes tdPulse {
      0%, 100% { opacity: 1 }
      50%       { opacity: 0.6 }
    }

    /* ── Animation utilities ───────────────────────────────────────── */
    .animate-fadeInUp  { animation: fadeInUp 0.6s ease-out forwards; }
    .animate-scaleIn   { animation: scaleIn  0.4s ease-out forwards; }
    .animate-shake     { animation: shake    0.4s ease; }
    .animate-td-pulse  { animation: tdPulse  1.5s ease infinite; }

    /* Fix dropdown option text visibility in dark theme */
    select option {
      background-color: #1A1A1A;
      color: #F2F2F2;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Hide native date picker icon – we use a custom overlay button */
    .date-input-custom::-webkit-calendar-picker-indicator {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
      right: 0;
    }

    /* Print Styles - Color-accurate PDF Export */
    @media print {
      @page {
        margin: 0;
        size: auto;
      }

      html,
      body {
        height: 100%;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Hide everything except the invoice */
      nav,
      footer,
      .actions-sidebar,
      button,
      .no-print,
      header {
        display: none !important;
      }

      #root {
        padding: 0 !important;
        margin: 0 !important;
      }

      main {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: none !important;
        display: block !important;
      }

      /* The invoice container */
      #invoice-capture {
        box-shadow: none !important;
        width: 210mm !important;
        min-height: auto !important;
        margin: 0 auto !important;
        padding: 18mm !important;
        box-sizing: border-box !important;
        position: relative !important;
        overflow: visible !important;
        transform: none !important;
        filter: none !important;
        border: none !important;
        border-radius: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Force all elements to print their backgrounds/colors */
      *,
      *::before,
      *::after {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        text-shadow: none !important;
      }

      /* Drop shadow - remove for print */
      .drop-shadow-\[0_0_15px_rgba\(255\,149\,0\,0\.4\)\] {
        filter: none !important;
      }

      /* Ensure images print */
      img {
        max-width: 100% !important;
        display: block !important;
      }
    }

    /* ponytail: panel thông báo neo theo nút chuông (absolute right:0) nên trên
       màn hẹp nó tràn khỏi mép trái. Media query kéo về full width thay vì tính
       toạ độ bằng JS. Nâng cấp: nếu có thêm popover kiểu này thì gom thành
       .mobile-sheet dùng chung. */
    @media (max-width: 767px) {
      .notif-panel {
        position: fixed !important;
        top: 60px !important;
        left: 8px !important;
        right: 8px !important;
        width: auto !important;
        max-height: 70vh !important;
      }
    }

    /* Mobile — tiêu đề trang trong Portal/Company Hub.
       7 tab đặt tiêu đề bằng inline style (2rem, #06B6D4) nên phải !important để đè.
       Ở màn hẹp: thu nhỏ, đổi về cam brand cho khớp Trang chủ, và bỏ dòng mô tả
       phụ (thanh tab đáy đã cho biết đang ở đâu, không cần lặp lại). */
    @media (max-width: 767.98px) {
      .portal-main h2 {
        font-size: 1.15rem !important;
        color: #FF9500 !important;
        letter-spacing: -0.01em !important;
      }
      .portal-main h2 + p {
        display: none !important;
      }
    }
  </style>

  <script>
    // Đăng ký service worker để trình duyệt cho phép cài app. Lỗi thì kệ — app vẫn chạy.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () { });
      });
    }
  </script>
